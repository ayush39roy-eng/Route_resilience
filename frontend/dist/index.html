<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Resilience — Road Network Criticality Dashboard</title>

    <!-- Space Grotesk (display) + Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Design tokens ───────────────────────────────────────────────────── */
      :root {
        /* Backgrounds */
        --bg-base:       #0A0E14;
        --bg-panel:      #0F1520;
        --bg-elevated:   #141C2B;
        --bg-raised:     #1A2237;
        --bg-input:      #111826;

        /* Borders */
        --border:        #1E293B;
        --border-mid:    #253347;
        --border-strong: #2E3F55;

        /* Text */
        --text-primary:  #E2EAF4;
        --text-secondary:#8A9BB0;
        --text-tertiary: #4A5C6E;

        /* Accent — blue */
        --accent:        #3B82F6;
        --accent-dim:    #162444;
        --accent-hover:  #2563EB;
        --accent-glow:   rgba(59,130,246,0.28);

        /* Semantic */
        --success:       #10B981;
        --success-dim:   #0C2018;
        --warning:       #F59E0B;
        --warning-dim:   #221808;
        --danger:        #EF4444;
        --danger-dim:    #261010;

        /* Shadows */
        --shadow-sm:  0 2px 8px rgba(0,0,0,0.5);
        --shadow-md:  0 4px 20px rgba(0,0,0,0.6);
        --shadow-lg:  0 8px 40px rgba(0,0,0,0.7);
        --shadow-xl:  0 16px 60px rgba(0,0,0,0.8);

        /* Radii */
        --r-sm:   4px;
        --r-md:   8px;
        --r-lg:   12px;
        --r-xl:   16px;
        --r-full: 9999px;

        /* Spacing (4px base) */
        --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
        --sp-4: 16px; --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;

        /* Motion */
        --ease:    180ms cubic-bezier(0.4, 0, 0.2, 1);
        --ease-md: 260ms cubic-bezier(0.4, 0, 0.2, 1);
        --ease-lg: 380ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ── Reset ───────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        background: var(--bg-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "cv11" 1, "ss01" 1;
        /* Layered depth gradient */
        background-image:
          radial-gradient(ellipse 90% 55% at 50% -5%,  rgba(15, 30, 70, 0.55) 0%, transparent 65%),
          radial-gradient(ellipse 50% 35% at 10% 100%, rgba(10, 20, 55, 0.35) 0%, transparent 60%);
        background-attachment: fixed;
      }

      /* Subtle starfield texture */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,0.22) 0.6px, transparent 0.6px),
          radial-gradient(circle, rgba(255,255,255,0.10) 0.6px, transparent 0.6px);
        background-size: 137px 137px, 89px 89px;
        background-position: 0 0, 44px 68px;
        opacity: 0.45;
      }

      #root {
        position: relative;
        z-index: 1;
      }

      button, select, input { font-family: inherit; }

      /* ── Scrollbar ───────────────────────────────────────────────────────── */
      ::-webkit-scrollbar          { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track    { background: transparent; }
      ::-webkit-scrollbar-thumb    { background: var(--border-mid); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

      /* ── Focus ring ──────────────────────────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>

    <link rel="stylesheet" crossorigin href="/assets/index-vnQXzsTV.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
