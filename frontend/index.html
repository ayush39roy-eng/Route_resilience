<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Resilience — ISRO Road Network Criticality</title>

    <!-- Space Grotesk (display) + Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Design tokens — deep-space amber/blue ───────────────────────── */
      :root {
        /* Backgrounds */
        --bg-base:       #0A0A0F;
        --bg-panel:      #0E0C09;
        --bg-elevated:   #161108;
        --bg-raised:     #1E1810;

        /* Borders */
        --border:        #2A2018;
        --border-mid:    #3A2E1E;
        --border-strong: #4A3C28;

        /* Text */
        --text-primary:  #F5F1EA;
        --text-secondary:#9A8F82;
        --text-tertiary: #5A5048;

        /* Primary accent — amber (muted, warmer) */
        --accent:        #D97B1A;
        --accent-bright: #F59332;
        --accent-dim:    #1E1208;
        --accent-hover:  #E8901A;
        --accent-glow:   rgba(217,123,26,0.28);

        /* Secondary accent — sky blue */
        --secondary:     #3B9EFF;
        --secondary-dim: #081828;

        /* Semantic */
        --success:       #22C55E;
        --success-dim:   #081808;
        --warning:       #F59E0B;
        --warning-dim:   #1E1408;
        --danger:        #EF4444;
        --danger-dim:    #1E0808;

        /* Shadows */
        --shadow-sm:  0 2px 8px rgba(0,0,0,0.6);
        --shadow-md:  0 4px 20px rgba(0,0,0,0.7);
        --shadow-lg:  0 8px 40px rgba(0,0,0,0.8);
        --shadow-xl:  0 16px 60px rgba(0,0,0,0.9);

        /* Radii */
        --r-sm:   4px;   --r-md:  8px;
        --r-lg:   12px;  --r-xl:  16px;
        --r-full: 9999px;

        /* Spacing */
        --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
        --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;

        /* Motion */
        --ease:    180ms cubic-bezier(0.4, 0, 0.2, 1);
        --ease-md: 260ms cubic-bezier(0.4, 0, 0.2, 1);
        --ease-lg: 380ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ── Reset ───────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        background: var(--bg-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "cv11" 1, "ss01" 1;
        /* Warm deep-space gradient: amber glow from bottom, cool from top */
        background-image:
          radial-gradient(ellipse 70% 45% at 20% 110%, rgba(217,123,26,0.12) 0%, transparent 60%),
          radial-gradient(ellipse 65% 45% at 85% -5%,  rgba(59,158,255,0.13) 0%, transparent 60%),
          radial-gradient(ellipse 50% 35% at 100% 90%, rgba(56,189,248,0.07) 0%, transparent 55%),
          radial-gradient(ellipse 100% 60% at 50% 50%, rgba(16,10,6,0.85) 0%, transparent 100%);
        background-attachment: fixed;
      }

      /* Starfield texture — subtle dot grid */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,0.18) 0.5px, transparent 0.5px),
          radial-gradient(circle, rgba(255,200,120,0.10) 0.5px, transparent 0.5px);
        background-size: 127px 127px, 83px 83px;
        background-position: 0 0, 40px 60px;
        opacity: 0.5;
      }

      #root { position: relative; z-index: 1; }

      button, select, input { font-family: inherit; }

      /* ── Scrollbar ───────────────────────────────────────────────────── */
      ::-webkit-scrollbar          { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track    { background: transparent; }
      ::-webkit-scrollbar-thumb    { background: #3A2E1E; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #4A3C28; }

      /* ── Focus ring — amber ──────────────────────────────────────────── */
      :focus-visible {
        outline: 2px solid #FF7A1A;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
